<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>9A2 · The Teenage Brain — Reading &amp; Understanding Claims</title>
<style>
:root{
  /* kid-first candy palette (对齐 U1 kai 金标准) */
  --ink:#2B2A33; --ink-soft:#5A5866; --cream:#FFF4E7;
  --orange:#FF7A3D; --orange-d:#EA5B22; --orange-l:#FFE3CE;
  --terra:#FF7A3D; --terra-d:#EA5B22;
  --amber:#F6A623; --amber-d:#D8860A; --amber-l:#FCE7BE;
  --teal:#12897E; --teal-d:#0C6A62; --teal-l:#CDEBE6;
  --pink:#EC4B93; --pink-d:#D22E78; --pink-l:#FBD7E8;
  --purple:#8B5CF6; --purple-d:#6D3EE0; --purple-l:#E7DEFB;
  --violet:#8B5CF6; --violet-d:#6D3EE0;
  --green:#22B573; --green-d:#189259; --green-l:#CDEFDD; --grass:#22B573;
  --blue:#3D8BFF; --blue-d:#2168DB; --blue-l:#D5E6FF;
  --wine:#8B5CF6; --sage:#12897E; --sky:#D5E6FF;
  /* 字体走 Comic Sans（Rico 课件铁律 §10），全副去衬线 */
  --serif:"Comic Sans MS","Chalkboard SE","Comic Neue",-apple-system,"PingFang SC",sans-serif;
  --sans:"Comic Sans MS","Chalkboard SE","Comic Neue",-apple-system,"PingFang SC",sans-serif;
  --round:var(--sans);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0d0b09;font-family:var(--sans);overflow:hidden}
#stage{position:absolute;inset:0}
.frame{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--cream)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
  display:flex;flex-direction:column;justify-content:center;padding:6.5vh 7vw;background:var(--cream)}
.slide.active{opacity:1;visibility:visible}
.slide.center{align-items:center;text-align:center}

/* themes — 明亮马卡龙底 + 软萌色斑 blob（每页换色，去学术象牙底） */
.t-ink{background:#20303A;color:#EAF3F2}
.t-cream{background:#FFF4E7;background-image:radial-gradient(circle at 86% 12%,rgba(236,75,147,.10),transparent 40%),radial-gradient(circle at 9% 92%,rgba(139,92,246,.10),transparent 42%)}
.t-terra{background:#FFEEE4;background-image:radial-gradient(circle at 88% 13%,rgba(255,122,61,.15),transparent 42%),radial-gradient(circle at 8% 90%,rgba(61,139,255,.10),transparent 42%)}
.t-amber{background:#FFF7DE;background-image:radial-gradient(circle at 85% 13%,rgba(246,166,35,.17),transparent 42%),radial-gradient(circle at 10% 90%,rgba(34,181,115,.10),transparent 42%)}
.t-green{background:#E9F7F0;background-image:radial-gradient(circle at 86% 12%,rgba(34,181,115,.15),transparent 42%),radial-gradient(circle at 10% 90%,rgba(61,139,255,.10),transparent 42%)}
.t-violet{background:#F3EEFF;background-image:radial-gradient(circle at 86% 12%,rgba(139,92,246,.15),transparent 42%),radial-gradient(circle at 10% 90%,rgba(236,75,147,.10),transparent 42%)}
.t-wine{background:#EEEBFF;background-image:radial-gradient(circle at 86% 12%,rgba(139,92,246,.15),transparent 42%),radial-gradient(circle at 10% 90%,rgba(61,139,255,.10),transparent 42%)}
.t-teal{background:#EAF6F8;background-image:radial-gradient(circle at 86% 12%,rgba(18,137,126,.13),transparent 42%),radial-gradient(circle at 10% 90%,rgba(246,166,35,.10),transparent 42%)}
.t-sky{background:#EEF4FF;background-image:radial-gradient(circle at 86% 12%,rgba(61,139,255,.13),transparent 42%),radial-gradient(circle at 10% 90%,rgba(236,75,147,.10),transparent 42%)}

.eyebrow{display:inline-flex;align-self:flex-start;font-size:1.35vw;letter-spacing:.03em;font-weight:700;
  color:var(--teal-d);background:var(--teal-l);padding:.7vh 1.1vw;border-radius:999px;margin-bottom:.6vh}
.center .eyebrow{align-self:center}
.hero .eyebrow{background:rgba(255,255,255,.18);color:#fff}
.t-ink .eyebrow{color:#20303A;background:#F0C56A}
h1.d{font-family:var(--serif);font-size:6vw;line-height:1.02;color:var(--ink);letter-spacing:-.01em;font-weight:700}
.t-ink h1.d{color:#FFF8EE}
h2.d{font-family:var(--serif);font-size:3.9vw;line-height:1.06;color:var(--ink);margin-top:1.2vh;font-weight:700}
.t-ink h2.d{color:#FFF8EE}
.lead{font-size:1.85vw;line-height:1.5;color:var(--ink-soft);max-width:48ch;margin-top:2.4vh}
.t-ink .lead{color:#DFECEB}
.tag{position:absolute;top:3vh;right:3vw;font-size:1.15vw;letter-spacing:.06em;color:#b6a894;font-weight:700}
.rule{width:4.4vw;height:.7vh;background:var(--terra);margin-top:2vh;border-radius:999px}
.hint{font-size:1.4vw;color:var(--ink-soft);margin-top:1vh}

/* nav */
#nav{position:fixed;bottom:2.2vh;left:50%;transform:translateX(-50%);display:flex;gap:1.4vw;align-items:center;z-index:60}
.navbtn{width:4.4vh;height:4.4vh;border-radius:50%;border:none;background:rgba(0,0,0,.26);color:#fff;
  font-size:2.1vh;cursor:pointer;display:flex;align-items:center;justify-content:center}
.navbtn:hover{background:rgba(0,0,0,.5)}
#dots{display:flex;gap:.55vw;max-width:60vw;flex-wrap:wrap;justify-content:center}
.dot{width:.95vh;height:.95vh;border-radius:50%;background:rgba(0,0,0,.2)}
.dot.on{background:var(--terra);transform:scale(1.5)}
#lessonbadge{position:fixed;top:2.4vh;left:2.4vw;font-size:1.15vw;letter-spacing:.12em;color:#b7ad9c;z-index:60}

.rise{opacity:0;transform:translateY(24px);animation:rise .7s forwards}
.rise.d2{animation-delay:.2s}.rise.d3{animation-delay:.42s}
@keyframes rise{to{opacity:1;transform:none}}

/* full-bleed hero */
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,11,8,.92) 30%,rgba(15,11,8,.2) 78%)}
.hero .body{position:relative}

/* split */
.split{padding:0;flex-direction:row}
.split .half{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8vh 4.5vw}
.split .pic{background-size:cover;background-position:center}

/* image panel (content with side image) */
.imgpanel{position:absolute;top:0;right:0;bottom:0;width:44%;background-size:cover;background-position:center}
.imgpanel.feather::before{content:"";position:absolute;inset:0;width:150px;background:linear-gradient(90deg,var(--cream),transparent)}
.narrow{max-width:52%}

/* boxes / cards */
.card{background:#fff;border-radius:14px;padding:2.2vh 1.6vw;box-shadow:0 6px 20px rgba(120,90,40,.12)}
.deflist{margin-top:2.4vh;display:flex;flex-direction:column;gap:1.4vh}
.defrow{border-left:5px solid var(--terra);padding-left:1vw}
.defrow .k{font-size:1.2vw;letter-spacing:.12em;text-transform:uppercase;color:var(--terra);font-weight:700}
.defrow .v{font-size:1.7vw;color:#33302b;margin-top:.3vh}

/* video */
.videowrap{margin-top:2.6vh;width:60%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;
  box-shadow:0 14px 40px rgba(0,0,0,.4)}
.videowrap video{width:100%;height:100%;object-fit:cover;display:block}
.recall{margin-top:2.4vh;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);
  border-radius:12px;padding:1.8vh 1.6vw;font-size:1.55vw}
.t-cream .recall,.t-terra .recall{background:#fff;border-color:#e7dcc9;color:#33302b}

/* journey / skill map */
.journey{display:flex;gap:1.4vw;margin-top:3vh;flex-wrap:wrap}
.jstep{flex:1;min-width:11vw;background:#fff;border-radius:12px;padding:2vh 1vw;text-align:center;
  box-shadow:0 5px 16px rgba(120,90,40,.1);position:relative}
.jstep.now{background:var(--terra);color:#fff}
.jstep.done{background:#e6efe6}
.jstep .n{font-size:1.1vw;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.jstep .t{font-family:var(--serif);font-size:1.7vw;margin-top:.5vh}

/* guess game */
.foodrow{display:flex;gap:2vw;margin-top:3.4vh}
.foodcard{flex:1;background:#fff;border-radius:14px;padding:2.4vh 1.3vw 2vh;text-align:center;cursor:pointer;
  box-shadow:0 6px 20px rgba(150,110,40,.13);transition:transform .18s}
.foodcard:hover{transform:translateY(-6px)}
.foodcard .fe{font-size:4.6vw;line-height:1}
.foodcard .fn{font-family:var(--serif);font-size:1.8vw;margin-top:1vh;color:var(--ink)}
.bar{height:1.3vh;background:#eee;border-radius:1vh;margin-top:1.6vh;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--terra);transition:width 1s ease}
.gram{font-size:1.4vw;color:var(--terra);font-weight:700;margin-top:.7vh;opacity:0;transition:opacity .5s}
.foodcard.win{outline:3px solid var(--grass);outline-offset:-3px}
.revealed .gram{opacity:1}

/* vocab flip */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw;margin-top:2.6vh;height:64vh}
.vgrid.two{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.flip{perspective:1200px;cursor:pointer}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;overflow:hidden;box-shadow:0 8px 22px rgba(120,90,40,.16)}
.front{background-size:cover;background-position:center}
.front .lab{position:absolute;left:0;right:0;bottom:0;padding:1.3vh 1.1vw;background:linear-gradient(0deg,rgba(15,11,8,.82),transparent);color:#fff}
.front .w{font-family:var(--serif);font-size:2.1vw}
.front .ipa{font-size:1.1vw;opacity:.86;font-style:italic}
.back{background:#fff;transform:rotateY(180deg);padding:2.2vh 1.3vw;display:flex;flex-direction:column;justify-content:center}
.back .w{font-family:var(--serif);font-size:1.9vw;color:var(--terra)}
.back .def{font-size:1.4vw;color:#33302b;margin-top:1vh;border-left:4px solid var(--terra);padding-left:.7vw;line-height:1.3}
.back .ex{font-family:var(--serif);font-style:italic;font-size:1.4vw;color:#26241f;margin-top:auto}

/* quickset */
.qsgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw 2vw;margin-top:2.6vh}
.qsrow{background:#fff;border-radius:10px;padding:1.6vh 1.2vw;box-shadow:0 4px 12px rgba(120,90,40,.08)}
.qsrow .w{font-family:var(--serif);font-size:1.7vw;color:var(--ink)}
.qsrow .w small{color:#8a8477;font-style:italic;font-weight:400;font-size:1vw;margin-left:.5vw}
.qsrow .d{font-size:1.3vw;color:#544e44;margin-top:.4vh}

/* word game */
.wm-def{font-family:var(--serif);font-size:3vw;color:var(--ink);text-align:center;margin-top:2vh;min-height:8vh}
.t-green .wm-def{color:#1e3a24}
.wm-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:1.4vw;max-width:58vw;margin:2.6vh auto 0}
.wm-opt{background:#fff;border:2px solid transparent;border-radius:12px;padding:2.2vh 1vw;font-size:1.9vw;font-weight:600;
  color:var(--ink);cursor:pointer;box-shadow:0 5px 16px rgba(60,110,70,.12);transition:transform .12s}
.wm-opt:hover{transform:translateY(-4px)}
.wm-opt.right{background:#dff2e2;border-color:var(--grass);color:var(--grass)}
.wm-opt.wrong{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.scorebar{position:absolute;top:3vh;right:3vw;font-size:1.6vw;font-weight:700;color:var(--grass)}
.wm-msg{text-align:center;font-size:1.6vw;color:var(--grass);margin-top:2.2vh;height:2.4vh;font-weight:600}

/* kick game */
.pitch{position:absolute;inset:0}
.goal{position:absolute;top:6vh;left:50%;transform:translateX(-50%);width:30vw;height:18vh;
  border:.7vw solid #fff;border-bottom:none;border-radius:.5vw .5vw 0 0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 6px,transparent 6px 14px),repeating-linear-gradient(0deg,rgba(255,255,255,.3) 0 6px,transparent 6px 14px)}
.goallabel{position:absolute;top:25vh;left:50%;transform:translateX(-50%);color:#0e5a2e;font-weight:800;font-size:1.4vw;letter-spacing:.1em}
.khead{position:absolute;top:46vh;left:5vw;right:5vw;text-align:center}
.khead h2.d{color:#fff;font-size:3.4vw}
.khead p{font-size:1.55vw;color:#eafbe9;margin-top:1vh}
.khead .eyebrow{color:#eafbe9}
.balls{position:absolute;bottom:5.5vh;left:0;right:0;display:flex;justify-content:center;gap:1.8vw;flex-wrap:wrap;padding:0 6vw}
.ball{width:10.5vh;height:10.5vh;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.24);transition:transform .55s cubic-bezier(.2,.7,.3,1),opacity .55s}
.ball .fe{font-size:3.2vh;line-height:1}
.ball .fn{font-size:1.05vw;font-weight:700;color:var(--ink);margin-top:.3vh}
.ball.scored{transform:translateY(-56vh) scale(.5);opacity:0}
.ball.keep{animation:shake .45s}
.kmsg{position:absolute;bottom:1.8vh;left:0;right:0;text-align:center;font-size:1.6vw;font-weight:700;color:#0e3a1c;height:2.4vh}

/* reading */
.reading .para{font-size:2vw;line-height:1.5;color:#2b2822;max-width:34ch}
.reading .para.wide{max-width:56ch}
mark{background:var(--amber-l);color:var(--orange-d);padding:0 .16em;border-radius:.3em;font-weight:700}
.reading mark{background:var(--amber-l);color:var(--orange-d)}
.reading .imgpanel{width:40%}

/* comprehension */
.comp .q{margin-top:2vh}
.comp .q .qt{font-size:1.7vw;font-weight:600;color:var(--ink)}
.comp .q .qtag{font-size:1vw;letter-spacing:.1em;color:var(--terra);text-transform:uppercase;margin-left:.6vw}
.comp .q .opts{font-size:1.45vw;color:#544e44;margin-top:.5vh}
.reveal-box{margin-top:2.4vh;background:#dff2e2;border-radius:12px;padding:1.8vh 1.6vw;font-size:1.7vw;color:#1e6b3f;
  max-width:60vw;opacity:0;max-height:0;overflow:hidden;transition:opacity .4s,max-height .4s}
.reveal-box.show{opacity:1;max-height:40vh}
.revealbtn{margin-top:2.4vh;font-family:var(--sans);font-size:1.5vw;font-weight:600;padding:.7em 1.6em;border:none;
  border-radius:.6em;background:var(--terra);color:#fff;cursor:pointer;align-self:flex-start}
.revealbtn:active{transform:scale(.97)}

/* exit */
.recapgrid{display:flex;gap:2.2vw;margin-top:3.4vh}
.rc{background:rgba(255,255,255,.08);border-radius:14px;padding:2.6vh 1.7vw;flex:1}
.t-cream .rc,.t-green .rc{background:#fff;box-shadow:0 6px 18px rgba(120,90,40,.1)}
.rc .n{font-family:var(--serif);font-size:3.6vw;color:var(--amber)}
.t-ink .rc .n{color:#e8b968}
.rc .t{font-size:1.4vw;color:#cdc3b1;margin-top:.5vh}
.t-cream .rc .t,.t-green .rc .t{color:#6a6154}
#confetti{position:absolute;inset:0;pointer-events:none}

/* print/export mode: 隐藏翻页UI+关动画, 供整页截图转PPT */
body.print #nav,body.print #lessonbadge{display:none!important}
body.print *{transition:none!important;animation:none!important}
body.print .rise{opacity:1;transform:none}

/* venn (sort into overlapping circles) */
.t-violet{background:#ece7fb}
.vennpool{display:flex;flex-wrap:wrap;gap:.7vw;margin-top:1.8vh}
.vchip{font-family:var(--sans);font-size:1.3vw;font-weight:600;color:var(--ink);background:#fff;border:2px solid #e6dfce;
  border-radius:2em;padding:.7vh 1.1vw;cursor:pointer;box-shadow:0 4px 12px rgba(120,90,40,.12);transition:transform .12s}
.vchip:hover{transform:translateY(-3px)}
.vchip.sel{border-color:var(--violet);background:#efeaff;box-shadow:0 0 0 3px rgba(124,107,214,.28)}
.vchip.placed{background:#dff2e2;border-color:var(--grass);color:#1e6b3f;cursor:default;box-shadow:none;font-size:1.2vw;padding:.5vh .9vw}
.vennbox{position:relative;height:44vh;margin-top:2vh}
.vcircle{position:absolute;top:0;bottom:0;width:60%;border-radius:50%;border:.32vw solid}
.vcircle.l{left:1%;border-color:var(--violet);background:rgba(124,107,214,.13)}
.vcircle.r{right:1%;border-color:var(--terra);background:rgba(238,108,77,.13)}
.vzones{position:absolute;inset:0;display:flex;align-items:stretch}
.vzone{flex:1;display:flex;flex-direction:column;align-items:center;padding:2.6vh 1vw 1vh;cursor:pointer;border-radius:24px}
.vzone.mid{flex:0 0 26%}
.vzone:hover{background:rgba(0,0,0,.03)}
.vzlab{font-family:var(--serif);font-size:1.6vw;color:var(--ink);text-align:center;font-weight:700;pointer-events:none}
.vzone.mid .vzlab{color:#5a4bb0}
.vzdrop{margin-top:1.1vh;display:flex;flex-direction:column;gap:.6vh;align-items:center;width:100%;pointer-events:none}
.vzone.shake{animation:shake .42s}
.vmsg,.cmsg{text-align:center;font-size:1.45vw;font-weight:600;color:var(--grass);margin-top:1.4vh;min-height:2.2vh}
.vmsg{color:#8a7e69}

/* mcq (tap the correct option) */
.mcq{margin-top:1.8vh;display:flex;flex-direction:column;gap:1.4vh}
.mq{background:#fff;border-radius:12px;padding:1.5vh 1.4vw;box-shadow:0 4px 14px rgba(120,90,40,.1)}
.mqhead{display:flex;align-items:baseline;gap:.7vw;flex-wrap:wrap}
.mqn{font-family:var(--serif);font-size:1.55vw;color:var(--terra);font-weight:700}
.mqq{font-size:1.5vw;font-weight:600;color:var(--ink)}
.mq .qtag{font-size:.9vw;letter-spacing:.1em;color:var(--terra);text-transform:uppercase;background:#faeee6;padding:.2vh .55vw;border-radius:4px}
.mopts{display:flex;gap:.9vw;margin-top:1vh;flex-wrap:wrap}
.mopt{flex:1;min-width:15vw;text-align:left;font-family:var(--sans);font-size:1.28vw;color:#3b372f;background:#f7f2e8;
  border:2px solid transparent;border-radius:10px;padding:1.1vh 1vw;cursor:pointer;transition:transform .12s}
.mopt:hover{transform:translateY(-3px)}
.mopt b{color:var(--terra);margin-right:.45vw;text-transform:uppercase}
.mopt.right{background:#dff2e2;border-color:var(--grass);color:#1e6b3f}
.mopt.right b{color:var(--grass)}
.mopt.wrong{animation:shake .42s;border-color:#e0a08c}
.mq.done .mopt:not(.right){opacity:.5}

/* qcards (flip Q → A) */
.qcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1vw;margin-top:2.4vh;height:50vh}
.qcard{perspective:1200px;cursor:pointer}
.qcinner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.qcard.on .qcinner{transform:rotateY(180deg)}
.qcface{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:2vh 1.1vw;
  display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:0 8px 22px rgba(120,90,40,.15)}
.qcfront{background:#fff}
.qcq{font-family:var(--serif);font-size:1.45vw;color:var(--ink);line-height:1.3}
.qchint{font-size:.95vw;color:#b6a894;margin-top:1.3vh;letter-spacing:.08em;text-transform:uppercase}
.qcback{background:var(--terra);color:#fff;transform:rotateY(180deg)}
.qca{font-family:var(--serif);font-size:1.6vw;line-height:1.3}

/* quiz — one big question per page, tap an option card */
.quizq{font-size:2.3vw;line-height:1.4;color:var(--ink);font-weight:700;max-width:58vw;margin-top:2.2vh}
.qopts{display:flex;gap:1.4vw;margin-top:2.8vh;flex-wrap:wrap}
.qopts .qopt{flex:1;min-width:20vw;max-width:30vw;text-align:left;display:flex;gap:.9vw;align-items:flex-start;
  font-family:var(--sans);font-size:1.55vw;line-height:1.35;color:var(--ink);background:#fff;
  border:.45vh solid transparent;border-radius:16px;padding:2vh 1.3vw;cursor:pointer;
  box-shadow:0 6px 18px rgba(120,90,40,.13);transition:transform .12s}
.qopts .qopt:hover{transform:translateY(-4px)}
.qopts .qopt .qk{flex:none;width:3.6vh;height:3.6vh;border-radius:50%;background:var(--orange-l);color:var(--orange-d);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.5vw;text-transform:uppercase}
.qopts .qopt.right{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.qopts .qopt.right .qk{background:var(--green);color:#fff}
.qopts .qopt.wrong{animation:shake .42s;border-color:var(--red)}
.qopts.done .qopt:not(.right){opacity:.45}
.qnote{display:none;margin-top:2.2vh;background:#fff;border-left:.6vw solid var(--amber);border-radius:12px;
  padding:1.5vh 1.4vw;font-size:1.5vw;color:var(--ink-soft);max-width:52vw}
.quiz-done .qnote{display:block}

/* pick2 — tap the N words that fit */
.pickrow{display:flex;gap:1.4vw;margin-top:3vh;flex-wrap:wrap}
.pchip{font-family:var(--sans);font-size:2vw;font-weight:700;color:var(--ink);background:#fff;
  border:.45vh solid transparent;border-radius:999px;padding:1.6vh 2.2vw;cursor:pointer;
  box-shadow:0 6px 18px rgba(120,90,40,.13);transition:transform .12s}
.pchip:hover{transform:translateY(-4px)}
.pchip.right{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.pchip.wrong{animation:shake .42s;border-color:var(--red)}
.pmsg{font-size:1.6vw;font-weight:700;margin-top:2.2vh;min-height:2.4vh}

/* speak — production frame card */
.speakcard{display:flex;align-items:center;gap:1.6vw;background:#fff;border-radius:20px;
  box-shadow:0 8px 24px rgba(120,90,40,.15);padding:3vh 2.2vw;margin-top:2.6vh;max-width:58vw;
  flex:none;align-self:flex-start}
.speakcard .mic{font-size:4vw;line-height:1;max-height:5vw;display:flex;align-items:center;overflow:visible}
.speakcard .sframe{font-size:2.2vw;line-height:1.5;color:var(--ink);font-weight:700}
.speakcard .sframe mark{background:var(--pink-l);color:var(--pink-d)}
.speakrule{margin-top:2vh;font-size:1.45vw;font-weight:700;color:var(--teal-d);background:var(--teal-l);
  display:inline-flex;padding:.9vh 1.4vw;border-radius:999px}

/* cloze (tap a word, then a blank) */
.wbank{display:flex;flex-wrap:wrap;gap:.7vw;margin-top:1.8vh}
.wchip{font-family:var(--sans);font-size:1.35vw;font-weight:600;color:var(--ink);background:#fff;border:2px solid #e6dfce;
  border-radius:2em;padding:.7vh 1.2vw;cursor:pointer;box-shadow:0 4px 12px rgba(120,90,40,.12);transition:transform .12s}
.wchip:hover{transform:translateY(-3px)}
.wchip.sel{border-color:var(--terra);background:#faeee6;box-shadow:0 0 0 3px rgba(238,108,77,.24)}
.wchip.used{opacity:.32;cursor:default;box-shadow:none}
.clozep{font-size:1.75vw;line-height:2.3;color:#2b2822;max-width:62vw;margin-top:2.4vh}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:5vw;padding:0 .6vw;margin:0 .18vw;
  border-bottom:3px solid var(--terra);color:var(--terra);font-weight:700;cursor:pointer;border-radius:5px 5px 0 0}
.blank.filled{background:#dff2e2;border-bottom-color:var(--grass);color:#1e6b3f;cursor:default}
.blank.shake{animation:shake .42s}

/* synMatch — 同义词配对（7B2 新增 2026-08-01；class 前缀 syn*，不与 .frame 等全局撞名） */
.synwrap{display:flex;align-items:stretch;gap:2vw;margin-top:2.2vh}
.syncol{flex:1;display:flex;flex-direction:column;gap:1.5vh}
.synmid{display:flex;align-items:center;font-family:var(--serif);font-size:2.6vw;font-weight:700;
  color:var(--teal-d);opacity:.55}
.synchip{font-family:var(--sans);font-size:1.7vw;font-weight:700;color:var(--ink);background:#fff;
  border:.35vh solid #e6dfce;border-radius:999px;padding:1.5vh 1.6vw;min-height:56px;cursor:pointer;
  box-shadow:0 6px 18px rgba(120,90,40,.13);transition:transform .12s;text-align:center}
.synchip:hover{transform:translateY(-3px)}
.synchip.sel{border-color:var(--violet);background:#F3EEFF;box-shadow:0 0 0 4px rgba(139,92,246,.26)}
.synchip.right{background:var(--green-l);border-color:var(--green);color:var(--green-d);
  cursor:default;box-shadow:none;transform:none}
.synchip.right::after{content:" ✓"}
.synchip.wrong{animation:shake .48s;border-color:var(--orange-d);background:var(--orange-l)}
.synmsg{text-align:center;font-size:1.5vw;font-weight:700;color:#8a7e69;margin-top:2vh;min-height:2.4vh}

/* timeline — 事件放上时间轴（8A2 新增 2026-08-01；class 前缀 tl*，已 grep 过不与 .frame 等全局撞名） */
.tlpool{display:flex;flex-wrap:wrap;gap:.8vw;margin-top:2vh;justify-content:center;min-height:6vh}
.tlchip{font-family:var(--sans);font-size:1.3vw;font-weight:700;color:var(--ink);background:#fff;
  border:2px solid #e6dfce;border-radius:999px;padding:1vh 1.2vw;min-height:44px;cursor:pointer;
  box-shadow:0 5px 14px rgba(120,90,40,.13);transition:transform .12s}
.tlchip:hover{transform:translateY(-3px)}
.tlchip.sel{border-color:var(--purple);background:#F3EEFF;box-shadow:0 0 0 4px rgba(139,92,246,.26)}
.tlchip.placed{background:var(--green-l);border-color:var(--green);color:var(--green-d);
  cursor:default;box-shadow:none;transform:none;font-size:1.12vw;padding:.7vh .9vw}
.tlline{display:flex;align-items:flex-start;gap:.6vw;margin-top:3vh;padding-top:2.4vh;position:relative}
.tlline::before{content:"";position:absolute;left:2%;right:2%;top:2.4vh;height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--amber-l),var(--teal-l))}
.tlslot{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:18px;padding:0 .3vw 1vh}
.tlslot:hover{background:rgba(0,0,0,.03)}
.tlslot .tldot{width:16px;height:16px;border-radius:50%;background:var(--amber);border:3px solid #fff;
  box-shadow:0 2px 6px rgba(120,90,40,.3);margin-top:-1.9vh}
.tlslot .tlyear{font-family:var(--sans);font-size:1.5vw;font-weight:700;color:var(--teal-d);
  background:#fff;border-radius:999px;padding:.3vh .8vw;box-shadow:0 3px 9px rgba(120,90,40,.12);
  position:relative;top:-3.1vh;margin-bottom:-2.4vh;white-space:nowrap}
.tlslot .tldrop{display:flex;flex-direction:column;gap:.6vh;align-items:center;margin-top:1.2vh;min-height:8vh}
.tlslot.shake{animation:shake .42s}
.tlmsg{text-align:center;font-size:1.45vw;font-weight:700;color:#8a7e69;margin-top:1.6vh;min-height:2.2vh}

/* cmap — 概念图补全（8B2 新增 2026-08-01；class 前缀 cm*） */
.cmwrap{display:flex;align-items:center;gap:1.6vw;margin-top:2.2vh}
.cmcenter{flex:0 0 15vw;font-family:var(--sans);font-size:1.9vw;font-weight:700;color:#fff;text-align:center;
  background:var(--teal);border-radius:50% / 32%;padding:4vh 1vw;box-shadow:0 8px 22px rgba(18,137,126,.3)}
.cmbranches{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 1.2vw}
.cmbranch{background:#fff;border-radius:18px;padding:1.4vh 1.2vw;box-shadow:0 6px 18px rgba(120,90,40,.13);
  border-left:.5vw solid var(--amber)}
.cmbranch:nth-child(2){border-left-color:var(--purple)}
.cmbranch:nth-child(3){border-left-color:var(--blue)}
.cmbranch:nth-child(4){border-left-color:var(--pink)}
.cmq{font-family:var(--sans);font-size:1.35vw;font-weight:700;color:var(--teal-d);margin-bottom:.7vh}
.cmnote{font-size:1.25vw;line-height:1.9;color:#2b2822}
.cmblank{display:inline-flex;align-items:center;justify-content:center;min-width:4.6vw;padding:0 .5vw;margin:0 .16vw;
  border-bottom:3px solid var(--terra);color:var(--terra);font-weight:700;cursor:pointer;border-radius:5px 5px 0 0}
.cmblank.filled{background:#dff2e2;border-bottom-color:var(--grass);color:#1e6b3f;cursor:default}
.cmblank.shake{animation:shake .42s}
.cmmsg{text-align:center;font-size:1.45vw;font-weight:700;color:#8a7e69;margin-top:1.8vh;min-height:2.2vh}

   text:'Recently, scientists discovered that though our brains are almost at their full size by the age of six, they are far from fully developed. Only during adolescence do our brains truly “grow up.” During this time, they <mark>go through</mark> great changes, like a computer system being <mark>upgraded</mark>. This “upgrade” was once thought to be finished by about age 12.'},

 {type:'reading', theme:'cream', eyebrow:'Reading · The Teenage Brain', title:'Paragraph B (2 of 2)',
   text:'Now, scientists have <mark>concluded</mark> that our brains continue to change until age 25. Such changes make us better at balancing our impulses with the need to follow rules. However, a still-developing brain does this clumsily. The result, scientists claim, is the unpredictable behavior seen in teenagers.'},

 {type:'quiz', theme:'violet', eyebrow:'After B · word check', title:'upgrade',
   q:'The brain goes through changes &ldquo;like a computer system being UPGRADED&rdquo;. What does that tell you?', ans:'a', opts:[
   {k:'a', t:'It is being improved while it still runs.'},
   {k:'b', t:'It is being switched off until it is finished.'},
   {k:'c', t:'It is being sold to somebody else.'}],
   note:'Upgrade = made better / more modern. The comparison matters: the brain keeps working **during** the upgrade &mdash; that is why it is clumsy.'},

 {type:'speak', theme:'sky', eyebrow:'After B · your turn', title:'Use it: go through',
   frame:'&ldquo;Last year I **went through** ______, and it changed ______.&rdquo;',
   rule:'Say at least 4 words. Something TRUE about you.'},

 {type:'quiz', theme:'wine', eyebrow:'After B · claim or fact?', title:'Age 25',
   q:'&ldquo;Scientists have **concluded** that our brains continue to change until age 25.&rdquo; What kind of statement is this?', ans:'b', opts:[
   {k:'a', t:'A guess with no studies or evidence behind it at all.'},
   {k:'b', t:'A conclusion the scientists reached from studies.'},
   {k:'c', t:'A rule that everybody has always known.'}],
   note:'&ldquo;Conclude&rdquo; is the signal word: somebody looked at evidence and then decided. Notice the text also says this was once thought to end at 12 &mdash; conclusions can change.'},

 /* ===== Paragraph C ===== */
 {type:'reading', theme:'cream', eyebrow:'Reading · The Teenage Brain', title:'Paragraph C',
   text:'The studies confirm that teens are more likely to take <mark>risks</mark> and behave in extreme ways. Fortunately, the news isn’t all negative. As brain scientist B. J. Casey points out, the teen brain inspires such behavior in order to help teenagers prepare for adult life.'},

 {type:'quiz', theme:'amber', eyebrow:'After C · word check', title:'take risks',
   q:'&ldquo;Teens are more likely to TAKE RISKS.&rdquo; Which student is taking a risk?', ans:'b', opts:[
   {k:'a', t:'She checks the answer twice before handing in her paper.'},
   {k:'b', t:'He tries a jump he has never landed before.'}],
   note:'A risk = something might go wrong. Say it: **take** a risk &mdash; never &ldquo;do a risk&rdquo;.'},

 {type:'pick2', theme:'green', eyebrow:'After C · read closely', need:2, title:'What does Paragraph C say?',
   q:'Click the TWO things Paragraph C actually says:',
   words:[{w:'Teens take more risks.', ok:1},{w:'All the news is bad.', ok:0},{w:'The behaviour helps teens get ready for adult life.', ok:1},{w:'Adults never behave in extreme ways.', ok:0}]},

 {type:'quiz', theme:'teal', eyebrow:'After C · whose claim?', title:'Who says it, and what do they say?',
   q:'Paragraph C names brain scientist B. J. Casey. What does Casey claim?', ans:'a', opts:[
   {k:'a', t:'The teen brain pushes that behaviour on purpose, to prepare teens.'},
   {k:'b', t:'The teen brain is broken and stays broken until it is finished growing.'},
   {k:'c', t:'Teenagers should be kept away from anything dangerous.'}],
   note:'When a name appears, ask two things: **who** is speaking, and **what exactly** are they claiming? That is today&rsquo;s skill.'},

 /* ===== Paragraph D ===== */
 {type:'reading', theme:'cream', eyebrow:'Reading · Risk and reward', title:'Paragraph D',
   text:'One way the brain does this is by changing the way teens measure risk and <mark>reward</mark>. Researchers found that when teens think about rewards, their brains release more of the chemicals that create <mark>pleasure</mark> than an adult brain would. Researchers believe this makes the rewards seem more important than the <mark>risks</mark>, and makes teens feel the <mark>excitement</mark> of new experiences more keenly than adults do.'},

 {type:'quiz', theme:'violet', eyebrow:'After D · word check', title:'reward',
   q:'Which one is a REWARD?', ans:'c', opts:[
   {k:'a', t:'The homework you still have to finish before you can go out.'},
   {k:'b', t:'The rain that started while you were walking home.'},
   {k:'c', t:'The prize you get for winning the race.'}],
   note:'A reward comes **after** something you did, and it feels good. That is why the brain uses it.'},

 {type:'speak', theme:'sky', eyebrow:'After D · your turn', title:'Use it: pleasure',
   frame:'&ldquo;I get a lot of **pleasure** from ______, because ______.&rdquo;',
   rule:'At least 4 words. Something TRUE about you.'},

 {type:'quiz', theme:'wine', eyebrow:'After D · what the evidence shows', title:'More chemicals',
   q:'Researchers found that a teen brain releases MORE feel-good chemicals for a reward than an adult brain. What do the researchers say this explains?', ans:'a', opts:[
   {k:'a', t:'Why the reward feels bigger than the danger.'},
   {k:'b', t:'Why teenagers need much more sleep than adults of the same weight.'},
   {k:'c', t:'Why adults are better at sport.'}],
   note:'This is the **evidence** under the claim in Paragraph C. Claim first, evidence after &mdash; that is how this text is built.'},

 /* ===== Paragraph E ===== */
 {type:'reading', theme:'cream', eyebrow:'Reading · Friends and the brain', title:'Paragraph E (1 of 2)', img:'para_friends.jpg',
   text:'Research into the structure of the teen brain also found that it makes social connections C D E seem especially <mark>rewarding</mark>. As such, teens have an <mark>intense</mark> need to meet new people. Scientists suggest this is because as teens, we begin to <mark>realize</mark> that our peers may one day control the world we live in.'},

 {type:'reading', theme:'cream', eyebrow:'Reading · Friends and the brain', title:'Paragraph E (2 of 2)',
   text:'Because it is still developing, a teen brain can change to <mark>deal with</mark> new situations. It therefore connects social <mark>rewards</mark> with even more <mark>pleasure</mark>. In this way, the brain encourages teens to have a wide circle of friends, which is believed to make us more successful in life.'},

 {type:'quiz', theme:'amber', eyebrow:'After E · word check', title:'intense',
   q:'Teens have an INTENSE need to meet new people. How strong is that need?', ans:'a', opts:[
   {k:'a', t:'Very strong.'},
   {k:'b', t:'Quite weak.'}],
   note:'Intense = very strong. Say it: an intense need / an intense feeling.'},

 {type:'pick2', theme:'green', eyebrow:'After E · word check', need:2, title:'realize',
   q:'Click the TWO sentences that use REALIZE correctly:',
   words:[{w:'I realized to go home.', ok:0},{w:'She suddenly realized that she was late.', ok:1},{w:'We realize how important friends are.', ok:1},{w:'He realized a new bike.', ok:0}]},

 {type:'quiz', theme:'sky', eyebrow:'After E · whose claim?', title:'Why friends feel so important',
   q:'Scientists SUGGEST a reason why social rewards feel so good to teenagers. What is it?', ans:'c', opts:[
   {k:'a', t:'Teenagers are afraid of being alone in the dark at night.'},
   {k:'b', t:'Teenagers have far more free time than the adults around them do.'},
   {k:'c', t:'Teens see that their peers may one day run the world.'}],
   note:'&ldquo;Suggest&rdquo; is a softer word than &ldquo;conclude&rdquo;. It is still a claim &mdash; but the writer is telling you it is less certain.'},

 /* ===== Paragraph F ===== */
 {type:'reading', theme:'cream', eyebrow:'Reading · The Teenage Brain', title:'Paragraph F',
   text:'Unfortunately, this hunt for greater <mark>rewards</mark> can sometimes lead teens to make bad decisions. However, it also means that teens are more likely, and less afraid, to try new things or to be independent. The scientists’ findings suggest that in the long run, the impulses of the teen brain are what help teens leave their parents’ care and live their own lives successfully.'},

 {type:'quiz', theme:'violet', eyebrow:'After F · word check', title:'in the long run',
   q:'&ldquo;IN THE LONG RUN, the impulses of the teen brain help teens live their own lives.&rdquo; When?', ans:'b', opts:[
   {k:'a', t:'Today or tomorrow.'},
   {k:'b', t:'After a long time, when you look back.'}],
   note:'In the long run = over a long period. The writer admits the short-term cost first (bad decisions), then gives the long-term gain.'},

 {type:'speak', theme:'teal', eyebrow:'After F · your turn', title:'Use it: take a risk',
   frame:'&ldquo;One day I want to **take a risk** and ______, because ______.&rdquo;',
   rule:'At least 4 words. Your own plan, not the text&rsquo;s.'},

 {type:'quiz', theme:'wine', eyebrow:'After F · the whole claim', title:'What do the scientists finally claim?',
   q:'Put the scientists&rsquo; whole claim in one sentence. Which one is it?', ans:'a', opts:[
   {k:'a', t:'Teenage impulses are useful: they push teens to run their own lives.'},
   {k:'b', t:'Teenage impulses are dangerous and should be controlled by parents at all times.'},
   {k:'c', t:'Teenage impulses stop as soon as the brain reaches age 12.'}],
   note:'The text does admit bad decisions happen &mdash; but that is the cost, not the claim. Read the last sentence again.'},

 {type:'speak', theme:'green', eyebrow:'Word recycle · one each', title:'Pick one word, say one sentence',
   pool:['risk','reward','upgrade','intense'],
   frame:'Say one sentence (at least 4 words) about your own life &mdash; **your own words**.',
   rule:'First come, first served &mdash; four words, no copying sentences from the text!'},

 /* ===== 技能 + 巩固 ===== */
 {type:'content', theme:'green', eyebrow:'Reading skill', title:'Understanding Claims',
   body:'A **claim** is something a person says is true. It is not automatically a fact. When you meet one, ask three questions: **(1) Who** says it? **(2) What exactly** do they say? **(3) What evidence** is given &mdash; a study, a number, an example, or nothing at all? Watch the signal words: **conclude** and **found** are strong; **suggest**, **believe** and **claim** are softer.'},

 {type:'mcq', theme:'violet', eyebrow:'Skill practice · claim or evidence?', title:'Which is the claim, and which is the evidence?',
   items:[
   {q:'&ldquo;Teens feel the excitement of new experiences more keenly than adults.&rdquo;', ans:'a', opts:[
     {k:'a', t:'a claim'},{k:'b', t:'evidence'},{k:'c', t:'neither'}]},
   {q:'&ldquo;Their brains release more of the chemicals that create pleasure.&rdquo;', ans:'b', opts:[
     {k:'a', t:'a claim'},{k:'b', t:'evidence'},{k:'c', t:'neither'}]},
   {q:'Which signal word tells you the scientists are LESS certain?', ans:'b', opts:[
     {k:'a', t:'concluded'},{k:'b', t:'suggest'},{k:'c', t:'found'}]},
   {q:'&ldquo;This was thought to be due to the foolishness of youth.&rdquo; Whose idea is this?', ans:'c', opts:[
     {k:'a', t:'B. J. Casey&rsquo;s own explanation'},{k:'b', t:'the writer&rsquo;s personal opinion here'},{k:'c', t:'an older idea, now replaced'}]}]},

 {type:'wordGame', theme:'green', eyebrow:'Game · choose the word', rounds:[
   {def:'the chance that something bad will happen', ans:'risk', opts:['risk','reward','pleasure','intense']},
   {def:'very strong', ans:'intense', opts:['upgrade','intense','reward','realize']},
   {def:'to decide after thinking about the facts', ans:'conclude', opts:['pleasure','risk','conclude','upgrade']},
   {def:'a change that makes something better', ans:'upgrade', opts:['reward','intense','risk','upgrade']},
   {def:'something good you get for doing something', ans:'reward', opts:['reward','conclude','pleasure','risk']}]},

 {type:'bigq', theme:'amber', eyebrow:'Critical thinking', q:'Does knowing this change anything?',
   note:'If your risky choices really come from a brain that is still upgrading, does that make you **less** responsible for them, or **more**? Give one reason. Then say one thing you would still do differently next time.'},

 {type:'exit', theme:'ink', center:true, eyebrow:'Wrap-up', title:'You read it &mdash; question by question.',
   recap:[{n:'6', t:'target words you worked with'},{n:'18', t:'questions you answered'},{n:'3', t:'claims you traced to evidence'}],
   next:'Next: Reading B &mdash; &ldquo;Seeing Double&rdquo;, two brothers with one life, and a new skill: inference.'}
]};
</script>
<script>
/* RE2 interactive lesson engine — data-driven. Each lesson defines window.LESSON {id, slides:[...]} */
(function(){
  const hl = s => (s||'').replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>');
  /* 单文件打包用：inline_lesson.py 会注入 window.KAI_IMG_MAP（文件名 → data URI）。
     没有这个 map 时照常走相对路径 img/xxx.jpg。与 kai.js 第 12 行同一约定。 */
  const imgsrc = fn => (window.KAI_IMG_MAP && window.KAI_IMG_MAP[fn]) ? window.KAI_IMG_MAP[fn] : ('img/'+fn);
  function eye(d){return d.eyebrow?`<div class="eyebrow">${d.eyebrow}</div>`:'';}
  function tag(d){return d.tagline?`<span class="tag">${d.tagline}</span>`:'';}

  const R = {
    hero: d => `<div class="bg" style="background-image:url('${imgsrc(d.img)}')"></div><div class="veil"></div>
      <div class="body">
        <div class="eyebrow rise">${d.eyebrow||''}</div>
        <h1 class="d rise d2" style="margin-top:2vh">${d.title}</h1>
        <p class="lead rise d3">${d.sub||''}</p></div>`,
    content: d => `${tag(d)}<div class="${d.img?'narrow':''}">
        ${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
        ${d.body?`<p class="lead">${hl(d.body)}</p>`:''}
        ${d.defs?`<div class="deflist">${d.defs.map(x=>`<div class="defrow"><div class="k">${x.k}</div><div class="v">${hl(x.v)}</div></div>`).join('')}</div>`:''}
      </div>${d.img?`<div class="imgpanel feather" style="background-image:url('${imgsrc(d.img)}')"></div>`:''}`,
    /* 2026-08-01 修：note 原来没过 hl()，写 **粗体** 会把星号原样显示给学生（8B2 实测到）。
       deck_check 的裸单星号检查只查单星号，双星号漏网——两把尺子都要看。 */
    bigq: d => `${tag(d)}${eye(d)}<h2 class="d">${d.q}</h2><div class="rule"></div>${d.note?`<p class="lead">${hl(d.note)}</p>`:''}`,
    split: d => `<div class="half ${d.leftTheme||''}">${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>${d.body?`<p class="lead">${hl(d.body)}</p>`:''}</div>
      <div class="half pic" style="background-image:url('${imgsrc(d.img)}')"></div>`,
    journey: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      <div class="journey">${d.steps.map(s=>`<div class="jstep ${s.state||''}"><div class="n">${s.n||''}</div><div class="t">${s.t}</div></div>`).join('')}</div>`,
    video: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2>
      <div class="videowrap"><video src="video/${d.src}" controls preload="metadata" playsinline></video></div>
      ${d.recall?`<div class="recall"><b>Quick recall (everyone types in chat):</b> ${d.recall}</div>`:''}`,
    guessGame: d => `${tag(d)}${eye(d)}<h2 class="d">${d.q}</h2><p class="hint">${d.hint||'Tap a food to guess. We reveal the real sugar.'}</p>
      <div class="foodrow" data-game="guess">${d.foods.map(f=>`<div class="foodcard" data-g="${f.g}" data-max="${d.max||30}"><div class="fe">${f.e}</div><div class="fn">${f.n}</div><div class="bar"><i></i></div><div class="gram">${f.g} g</div></div>`).join('')}</div>`,
    vocabFlip: d => `${tag(d)}${eye(d)}<div class="hint">${d.hint||'Tap each photo to see what the word means.'}</div>
      <div class="vgrid ${d.cards.length>3?'two':''}" data-game="flip">${d.cards.map(c=>`<div class="flip"><div class="inner">
        <div class="face front" style="background-image:url('${imgsrc(c.img)}')"><div class="lab"><div class="w">${c.w}</div><div class="ipa">${c.ipa}</div></div></div>
        <div class="face back"><div class="w">${c.w}</div><div class="def">${c.def}</div><div class="ex">&ldquo;${hl(c.ex)}&rdquo;</div></div></div></div>`).join('')}</div>`,
    quickset: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      <div class="qsgrid">${d.words.map(w=>`<div class="qsrow"><div class="w">${w.w}<small>${w.pos||''}</small></div><div class="d">${hl(w.def)}</div></div>`).join('')}</div>`,
    wordGame: d => `${tag(d)}<div class="scorebar">0 / ${d.rounds.length}</div>${eye(d)}
      <div class="wm-def"></div><div class="wm-opts"></div><div class="wm-msg"></div>`,
    kickGame: d => `<div class="pitch"><div class="goal"></div><div class="goallabel">${d.goalLabel||'CUT DOWN &#9917;'}</div>
      <div class="khead">${eye(d)}<h2 class="d">${d.q}</h2><p>${d.sub||''}</p></div>
      <div class="balls" data-game="kick">${d.foods.map(f=>`<div class="ball" data-high="${f.high?1:0}"><span class="fe">${f.e}</span><span class="fn">${f.n}</span></div>`).join('')}</div>
      <div class="kmsg"></div></div>`,
    reading: d => `${tag(d)}<div style="${d.img?'max-width:56%':''}">
        <div class="eyebrow">${d.eyebrow||'Reading'}</div><h2 class="d">${d.title}</h2><div class="rule"></div>
        <p class="para ${d.img?'':'wide'}">${hl(d.text)}</p></div>
      ${d.img?`<div class="imgpanel" style="background-image:url('${imgsrc(d.img)}')"></div>`:''}`,
    comp: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      <div class="comp">${d.items.map((q,i)=>`<div class="q"><span class="qt">${i+1}. ${q.q}</span>${q.tag?`<span class="qtag">${q.tag}</span>`:''}<div class="opts">${q.opts}</div></div>`).join('')}</div>
      <button class="revealbtn" data-reveal>Show answers</button>
      <div class="reveal-box">${d.answers}</div>`,
    videoRevisit: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      <p class="lead">${hl(d.prompt)}</p>
      <button class="revealbtn" data-reveal>Model answer</button>
      <div class="reveal-box">${d.answer}</div>`,
    exit: d => `<canvas id="confetti"></canvas>${eye(d)}<h1 class="d" style="font-size:4.6vw;margin-top:1.4vh">${d.title}</h1>
      <div class="recapgrid">${d.recap.map(r=>`<div class="rc"><div class="n">${r.n}</div><div class="t">${r.t}</div></div>`).join('')}</div>
      ${d.next?`<p class="lead" style="margin-top:3.4vh">${d.next}</p>`:''}`,
    quiz: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      <div class="quizq">${hl(d.q)}</div>
      <div class="qopts n${d.opts.length}" data-quiz data-ans="${d.ans}">${d.opts.map(o=>`<button class="qopt" data-k="${o.k}"><span class="qk">${o.k}</span><span class="qt">${hl(o.t)}</span></button>`).join('')}</div>
      ${d.note?`<div class="qnote">&#10024; ${hl(d.note)}</div>`:''}`,
    pick2: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      <div class="quizq">${hl(d.q)}</div>
      <div class="pickrow" data-pick data-need="${d.need||2}">${d.words.map(w=>`<button class="pchip" data-ok="${w.ok?1:0}">${w.w}</button>`).join('')}</div>
      <div class="pmsg"></div>`,
    speak: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      ${d.pool?`<div class="wbank" data-speakpool>${d.pool.map(w=>`<button class="wchip">${w}</button>`).join('')}</div>`:''}
      <div class="speakcard"><div class="mic">&#127908;</div><div class="sframe">${hl(d.frame)}</div></div>
      <div class="speakrule">&#9998; ${hl(d.rule||'Say at least 4 words. Your own words &mdash; don&rsquo;t copy the text!')}</div>`,
    venn: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      <div class="vennpool" data-pool>${d.items.map((it,i)=>`<button class="vchip" data-i="${i}" data-zone="${it.zone}">${it.t}</button>`).join('')}</div>
      <div class="vennbox"><div class="vcircle l"></div><div class="vcircle r"></div>
        <div class="vzones">
          <div class="vzone" data-zone="left"><div class="vzlab">${d.left}</div><div class="vzdrop"></div></div>
          <div class="vzone mid" data-zone="mid"><div class="vzlab">${d.mid||'Both'}</div><div class="vzdrop"></div></div>
          <div class="vzone" data-zone="right"><div class="vzlab">${d.right}</div><div class="vzdrop"></div></div>
        </div></div>
      <div class="vmsg" data-hint="Tap a card, then tap the circle it belongs in.">Tap a card, then tap the circle it belongs in.</div>`,
    mcq: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      <div class="mcq">${d.items.map((q,i)=>`<div class="mq" data-ans="${q.ans}">
        <div class="mqhead"><span class="mqn">${i+1}</span><span class="mqq">${hl(q.q)}</span>${q.tag?`<span class="qtag">${q.tag}</span>`:''}</div>
        <div class="mopts">${q.opts.map(o=>`<button class="mopt" data-k="${o.k}"><b>${o.k}</b> ${o.t}</button>`).join('')}</div>
      </div>`).join('')}</div>`,
    qcards: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      <div class="qcgrid">${d.items.map(c=>`<div class="qcard"><div class="qcinner">
        <div class="qcface qcfront"><div class="qcq">${hl(c.q)}</div><div class="qchint">tap to reveal</div></div>
        <div class="qcface qcback"><div class="qca">${hl(c.a)}</div></div></div></div>`).join('')}</div>`,
    cloze: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      <div class="wbank" data-bank>${d.bank.map(w=>`<button class="wchip" data-w="${w}">${w}</button>`).join('')}</div>
      <p class="clozep">${d.parts.map(p=> (typeof p==='string') ? hl(p) : `<span class="blank" data-w="${p.w}">${p.n}</span>`).join('')}</p>
      <div class="cmsg"></div>`,
    /* synMatch — tap a word, then tap the word that means (almost) the same.
       data: pairs:[{a,b}], order:[右列显示顺序的下标数组]（省略则按原序） */
    synMatch: d => { const ord = d.order || d.pairs.map((_,i)=>i); return `${tag(d)}${eye(d)}
      <h2 class="d">${d.title}</h2><div class="rule"></div>
      <div class="synwrap" data-syn>
        <div class="syncol">${d.pairs.map((p,i)=>`<button class="synchip" data-side="l" data-i="${i}">${p.a}</button>`).join('')}</div>
        <div class="synmid">=</div>
        <div class="syncol">${ord.map(j=>`<button class="synchip" data-side="r" data-i="${j}">${d.pairs[j].b}</button>`).join('')}</div>
      </div>
      <div class="synmsg">${hl(d.hint||'Tap a word on the left, then tap the word on the right that means almost the same.')}</div>`; },
    /* timeline — 事件卡放到时间轴上的正确刻度（8A2 新增 2026-08-01；配 Sequencing）
       data: slots:['1266','1271',…], items:[{t, slot:刻度下标}]  class 前缀 tl* */
    timeline: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      <div class="tlpool" data-tlpool>${d.items.map((it,i)=>`<button class="tlchip" data-i="${i}" data-slot="${it.slot}">${hl(it.t)}</button>`).join('')}</div>
      <div class="tlline">${d.slots.map((s,i)=>`<div class="tlslot" data-slot="${i}"><div class="tlyear">${s}</div><div class="tldot"></div><div class="tldrop"></div></div>`).join('')}</div>
      <div class="tlmsg">${hl(d.hint||'Tap an event, then tap the point on the line where it belongs.')}</div>`,
    /* cmap — 概念图补全（8B2 新增 2026-08-01；配 Taking Notes (2) — Using a Concept Map）
       data: center, bank:[…], branches:[{q, notes:[ '纯文字' | {pre,w,post} ]}]  class 前缀 cm* */
    cmap: d => `${tag(d)}${eye(d)}<h2 class="d">${d.title}</h2><div class="rule"></div>
      <div class="wbank" data-cmbank>${d.bank.map(w=>`<button class="wchip" data-w="${w}">${w}</button>`).join('')}</div>
      <div class="cmwrap"><div class="cmcenter">${d.center}</div>
        <div class="cmbranches">${d.branches.map(b=>`<div class="cmbranch"><div class="cmq">${hl(b.q)}</div>
          ${b.notes.map(n=> (typeof n === 'string')
            ? `<div class="cmnote">${hl(n)}</div>`
            : `<div class="cmnote">${hl(n.pre||'')}<span class="cmblank" data-w="${n.w}">?</span>${hl(n.post||'')}</div>`).join('')}
        </div>`).join('')}</div></div>
      <div class="cmmsg">${hl(d.hint||'Tap a word, then tap the gap in the map where it belongs.')}</div>`,
  };

  function wireReveal(sec){const btn=sec.querySelector('[data-reveal]'),box=sec.querySelector('.reveal-box');
    if(btn)btn.onclick=()=>{box.classList.add('show');btn.style.display='none';};}

  const INIT={
    guessGame(sec){sec.querySelector('[data-game=guess]').addEventListener('click',e=>{
      const c=e.target.closest('.foodcard'); if(!c)return; const row=c.parentElement; row.classList.add('revealed');
      let best=null,bg=-1;[...row.children].forEach(x=>{const g=+x.dataset.g,mx=+x.dataset.max;x.querySelector('.bar>i').style.width=(g/mx*100)+'%';if(g>bg){bg=g;best=x;}});best.classList.add('win');
    });},
    vocabFlip(sec){sec.querySelectorAll('.flip').forEach(f=>f.onclick=()=>f.classList.toggle('on'));},
    wordGame(sec,s){
      const def=sec.querySelector('.wm-def'),opts=sec.querySelector('.wm-opts'),msg=sec.querySelector('.wm-msg'),sb=sec.querySelector('.scorebar');
      let i=0,score=0;
      function render(){
        if(i>=s.rounds.length){def.textContent='';opts.innerHTML='';msg.innerHTML='All done &mdash; '+score+' / '+s.rounds.length+' correct! &#9989;';return;}
        const r=s.rounds[i];def.textContent=r.def;msg.textContent='';opts.innerHTML='';
        r.opts.forEach(o=>{const b=document.createElement('button');b.className='wm-opt';b.textContent=o;
          b.onclick=()=>{if(o===r.ans){b.classList.add('right');score++;sb.textContent=score+' / '+s.rounds.length;msg.style.color='';msg.textContent='Yes! '+o;setTimeout(()=>{i++;render();},700);}
            else{b.classList.add('wrong');msg.style.color='#B85C39';msg.textContent='Not quite — try again';setTimeout(()=>{b.classList.remove('wrong');msg.textContent='';},600);}};
          opts.appendChild(b);});
      }
      render();
    },
    kickGame(sec,s){
      const kmsg=sec.querySelector('.kmsg');let goals=0;const need=s.foods.filter(f=>f.high).length;
      const hit=s.hit||'GOAL! cut down on {n} &#9917;', miss=s.miss||'Keep {n} — it&rsquo;s healthy!',
            done=s.done||'Full time &mdash; you cut down on all the sugary foods! &#127881;';
      const fill=(t,n)=>t.replace('{n}',n);
      sec.querySelectorAll('.ball').forEach((b,k)=>{const f=s.foods[k];
        b.onclick=()=>{if(b.classList.contains('scored'))return;
          if(f.high){b.classList.add('scored');goals++;kmsg.style.color='#0e3a1c';kmsg.innerHTML=fill(hit,f.n);
            if(goals>=need)setTimeout(()=>{kmsg.innerHTML=done;},400);}
          else{b.classList.add('keep');kmsg.style.color='#B85C39';kmsg.innerHTML=fill(miss,f.n);setTimeout(()=>b.classList.remove('keep'),450);}};
      });
    },
    comp(sec){wireReveal(sec);},
    videoRevisit(sec){wireReveal(sec);},
    venn(sec){const pool=sec.querySelector('[data-pool]'),msg=sec.querySelector('.vmsg');let sel=null;
      pool.addEventListener('click',e=>{const c=e.target.closest('.vchip');if(!c||c.classList.contains('placed'))return;
        if(sel)sel.classList.remove('sel');if(sel===c){sel=null;return;}sel=c;c.classList.add('sel');});
      sec.querySelectorAll('.vzone').forEach(z=>z.addEventListener('click',()=>{
        if(!sel)return;
        if(sel.dataset.zone===z.dataset.zone){sel.classList.remove('sel');sel.classList.add('placed');
          z.querySelector('.vzdrop').appendChild(sel);sel=null;
          msg.style.color='#2f6b3f';msg.textContent='Nice — that fits!';
          if(!pool.querySelector('.vchip'))msg.textContent='All sorted! ✓';}
        else{z.classList.add('shake');msg.style.color='#B85C39';msg.textContent='Not that circle — try again';setTimeout(()=>z.classList.remove('shake'),420);}
      }));},
    mcq(sec){sec.querySelectorAll('.mq').forEach(q=>{const ans=q.dataset.ans;
      q.querySelectorAll('.mopt').forEach(b=>b.onclick=()=>{if(q.classList.contains('done'))return;
        if(b.dataset.k===ans){b.classList.add('right');q.classList.add('done');}
        else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),480);}});});},
    qcards(sec){sec.querySelectorAll('.qcard').forEach(c=>c.onclick=()=>c.classList.toggle('on'));},
    quiz(sec){const box=sec.querySelector('[data-quiz]'),ans=box.dataset.ans;
      box.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{if(box.classList.contains('done'))return;
        if(b.dataset.k===ans){b.classList.add('right');box.classList.add('done');sec.classList.add('quiz-done');}
        else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),480);}});},
    pick2(sec){const row=sec.querySelector('[data-pick]'),msg=sec.querySelector('.pmsg'),need=+row.dataset.need;let got=0;
      row.querySelectorAll('.pchip').forEach(c=>c.onclick=()=>{if(c.classList.contains('right'))return;
        if(c.dataset.ok==='1'){c.classList.add('right');got++;
          msg.style.color='#189259';msg.textContent=got>=need?'Both found! ✓':'One more…';}
        else{c.classList.add('wrong');msg.style.color='#CE2E2E';msg.textContent='That word can’t follow it — try again';
          setTimeout(()=>c.classList.remove('wrong'),480);}});},
    speak(sec){const pool=sec.querySelector('[data-speakpool]');if(!pool)return;let sel=null;
      pool.querySelectorAll('.wchip').forEach(c=>c.onclick=()=>{if(sel)sel.classList.remove('sel');sel=c;c.classList.add('sel');});},
    cloze(sec){const bank=sec.querySelector('[data-bank]'),msg=sec.querySelector('.cmsg');let sel=null;
      bank.addEventListener('click',e=>{const c=e.target.closest('.wchip');if(!c||c.classList.contains('used'))return;
        if(sel)sel.classList.remove('sel');if(sel===c){sel=null;return;}sel=c;c.classList.add('sel');});
      sec.querySelectorAll('.blank').forEach(bl=>bl.onclick=()=>{if(!sel||bl.classList.contains('filled'))return;
        if(sel.dataset.w===bl.dataset.w){bl.textContent=sel.dataset.w;bl.classList.add('filled');sel.classList.add('used');sel.classList.remove('sel');sel=null;
          msg.style.color='#2f6b3f';msg.textContent='Correct!';
          if(!bank.querySelector('.wchip:not(.used)'))msg.textContent='Passage complete! ✓';}
        else{bl.classList.add('shake');msg.style.color='#B85C39';msg.textContent='That word doesn’t fit here';setTimeout(()=>bl.classList.remove('shake'),420);}});},
    synMatch(sec){const w=sec.querySelector('[data-syn]'),msg=sec.querySelector('.synmsg');
      const L=[...w.querySelectorAll('.synchip[data-side="l"]')];let sel=null,done=0;
      L.forEach(c=>c.onclick=()=>{if(c.classList.contains('right'))return;
        if(sel)sel.classList.remove('sel');if(sel===c){sel=null;return;}sel=c;c.classList.add('sel');});
      w.querySelectorAll('.synchip[data-side="r"]').forEach(c=>c.onclick=()=>{
        if(!sel||c.classList.contains('right'))return;
        if(c.dataset.i===sel.dataset.i){c.classList.add('right');sel.classList.remove('sel');sel.classList.add('right');
          sel=null;done++;msg.style.color='#189259';
          msg.textContent=done>=L.length?'All matched — same meaning, different word! ✓':'Yes — those two mean the same.';}
        else{c.classList.add('wrong');msg.style.color='#B85C39';msg.textContent='Different meaning — pick the left word again and try another one';
          sel.classList.remove('sel');sel=null;setTimeout(()=>c.classList.remove('wrong'),480);}});},
    timeline(sec){const pool=sec.querySelector('[data-tlpool]'),msg=sec.querySelector('.tlmsg');let sel=null;
      pool.addEventListener('click',e=>{const c=e.target.closest('.tlchip');if(!c||c.classList.contains('placed'))return;
        if(sel)sel.classList.remove('sel');if(sel===c){sel=null;return;}sel=c;c.classList.add('sel');});
      sec.querySelectorAll('.tlslot').forEach(z=>z.addEventListener('click',()=>{
        if(!sel)return;
        if(sel.dataset.slot===z.dataset.slot){sel.classList.remove('sel');sel.classList.add('placed');
          z.querySelector('.tldrop').appendChild(sel);sel=null;
          msg.style.color='#189259';
          msg.textContent=pool.querySelector('.tlchip')?'Yes — that is when it happened.':'The whole journey is on the line! ✓';}
        else{z.classList.add('shake');msg.style.color='#B85C39';msg.textContent='Not that point on the line — pick the event again and try another year';
          sel.classList.remove('sel');sel=null;setTimeout(()=>z.classList.remove('shake'),420);}}));},
    cmap(sec){const bank=sec.querySelector('[data-cmbank]'),msg=sec.querySelector('.cmmsg');let sel=null;
      bank.addEventListener('click',e=>{const c=e.target.closest('.wchip');if(!c||c.classList.contains('used'))return;
        if(sel)sel.classList.remove('sel');if(sel===c){sel=null;return;}sel=c;c.classList.add('sel');});
      sec.querySelectorAll('.cmblank').forEach(bl=>bl.onclick=()=>{if(!sel||bl.classList.contains('filled'))return;
        if(sel.dataset.w===bl.dataset.w){bl.textContent=sel.dataset.w;bl.classList.add('filled');
          sel.classList.add('used');sel.classList.remove('sel');sel=null;
          msg.style.color='#189259';
          msg.textContent=bank.querySelector('.wchip:not(.used)')?'Correct!':'Concept map complete! ✓';}
        else{bl.classList.add('shake');msg.style.color='#B85C39';msg.textContent='That word does not belong in this branch';
          setTimeout(()=>bl.classList.remove('shake'),420);}});},
  };

  const confDone=new WeakSet();
  function confetti(cv){if(confDone.has(cv))return;confDone.add(cv);
    const ctx=cv.getContext('2d');cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;
    const cols=['#E0A83E','#B85C39','#5f7d6e','#8fc7d6','#f4efe3'];
    const P=Array.from({length:120},(_,k)=>({x:(k*97)%cv.width,y:-20-((k*53)%cv.height),r:4+(k%6),c:cols[k%cols.length],vy:2+(k%3),vx:-1+(k%3)*0.7,a:k%6}));
    let t=0;(function loop(){ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;if(p.y>cv.height+20)p.y=-20;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore();});t++;if(t<260)requestAnimationFrame(loop);})();
  }

  const frame=document.getElementById('frame');
  const L=window.LESSON;
  L.slides.forEach(s=>{
    const sec=document.createElement('section');
    let cls='slide '+(s.type==='hero'?'hero t-ink':('t-'+(s.theme||'cream')))+(s.center?' center':'');
    if(s.type==='reading') cls+=' reading';
    if(s.type==='split') cls+=' split';
    if(s.type==='comp') cls+=' comp';
    sec.className=cls;
    sec.innerHTML=(R[s.type]||R.content)(s);
    frame.appendChild(sec);
    if(INIT[s.type]) INIT[s.type](sec,s);
  });

  const slides=[...frame.querySelectorAll('.slide')];
  const dotsWrap=document.getElementById('dots');
  slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i?'':' on');dotsWrap.appendChild(d);});
  const badge=document.getElementById('lessonbadge');
  let idx=0;
  window.show=function(n){
    idx=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
    [...dotsWrap.children].forEach((d,i)=>d.classList.toggle('on',i===idx));
    if(badge) badge.textContent=L.id+' · '+(idx+1)+' / '+slides.length;
    const conf=slides[idx].querySelector('#confetti'); if(conf) confetti(conf);
  };
  document.getElementById('next').onclick=()=>show(idx+1);
  document.getElementById('prev').onclick=()=>show(idx-1);
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(idx+1);if(e.key==='ArrowLeft')show(idx-1);});
  show(0);

  const q=new URLSearchParams(location.search);
  if(q.has('reveal')) frame.querySelectorAll('.reveal-box').forEach(b=>{b.classList.add('show');const btn=b.previousElementSibling;if(btn&&btn.classList.contains('revealbtn'))btn.style.display='none';});
  if(q.has('print')) document.body.classList.add('print');
  if(q.has('answered')){
    frame.querySelectorAll('[data-quiz]').forEach(box=>{const b=box.querySelector('.qopt[data-k="'+box.dataset.ans+'"]');if(b)b.click();});
    frame.querySelectorAll('[data-pick]').forEach(row=>row.querySelectorAll('.pchip[data-ok="1"]').forEach(c=>c.click()));
    slides.forEach(sec=>{
      const pool=sec.querySelector('[data-pool]');
      if(pool)[...sec.querySelectorAll('.vchip')].forEach(ch=>{ch.click();const z=sec.querySelector('.vzone[data-zone="'+ch.dataset.zone+'"]');if(z)z.click();});
      const bank=sec.querySelector('[data-bank]');
      if(bank)bank.querySelectorAll('.wchip').forEach(w=>{w.click();const bl=sec.querySelector('.blank[data-w="'+w.dataset.w+'"]:not(.filled)');if(bl)bl.click();});
      const syn=sec.querySelector('[data-syn]');
      if(syn)syn.querySelectorAll('.synchip[data-side="l"]').forEach(l=>{l.click();
        const r=syn.querySelector('.synchip[data-side="r"][data-i="'+l.dataset.i+'"]');if(r)r.click();});
      const tlp=sec.querySelector('[data-tlpool]');
      if(tlp)[...sec.querySelectorAll('.tlchip')].forEach(ch=>{ch.click();
        const z=sec.querySelector('.tlslot[data-slot="'+ch.dataset.slot+'"]');if(z)z.click();});
      const cmb=sec.querySelector('[data-cmbank]');
      if(cmb)cmb.querySelectorAll('.wchip').forEach(w=>{w.click();
        const bl=sec.querySelector('.cmblank[data-w="'+w.dataset.w+'"]:not(.filled)');if(bl)bl.click();});
      sec.querySelectorAll('.mq').forEach(q=>{const b=q.querySelector('.mopt[data-k="'+q.dataset.ans+'"]');if(b)b.click();});
      sec.querySelectorAll('.qcard').forEach(c=>c.classList.add('on'));
    });
  }
  if(q.has('s')) show(+q.get('s'));
})();

</script>
</body></html>
